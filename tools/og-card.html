<!doctype html>
<!-- Source for og.png, this report's link-preview card.

     Render at twice the target size and downsample to 1200x630 (Lanczos):

       chrome --headless=new --window-size=1200,630
              --force-device-scale-factor=2 --screenshot=og2x.png
              tools/og-card.html

     The palette and type are this report page's own, so the preview looks
     like the page it opens rather than like a generic banner. Every figure
     on the card is stated and sourced on that page. -->
<html lang="en"><head><meta charset="utf-8">

<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{background:#06090d; color:#eaf0f6;
       display:flex; flex-direction:column; justify-content:center;
       padding:0 84px; box-sizing:border-box; position:relative}
  .grid{position:absolute; inset:0; opacity:.5;
    background-image:
      repeating-linear-gradient(to right,  #1e2733 0 1px, transparent 1px 76px),
      repeating-linear-gradient(to bottom, #1e2733 0 1px, transparent 1px 76px);}
  .glow{position:absolute; right:-180px; bottom:-240px; width:760px; height:760px;
    background:radial-gradient(circle, #69d9ff22 0%, transparent 62%)}
  .in{position:relative}
  .eyebrow{font-family:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size:19px; letter-spacing:.18em;
    text-transform:uppercase; color:#aab6c4; margin:0 0 30px}
  .head{font-family:ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; font-size:48px; line-height:1.22;
    font-weight:500; letter-spacing:-.01em; margin:0 0 30px; max-width:22ch}
  .fig{font-family:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size:28px; color:#69d9ff; margin:0 0 34px;
    letter-spacing:-.01em}
  .rule{height:1px; background:#1e2733; width:640px; margin:0 0 26px}
  .foot{font-family:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size:19px; color:#aab6c4; margin:0}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="in">
    <p class="eyebrow">fluid-sim &middot; incompressible Navier-Stokes on WebGPU</p>
    <p class="head">Validated against closed-form solutions, not against how it looks.</p>
    <p class="fig">&nu;_num = 5.79e-4 &middot; 2.9% of the physical &nu;</p>
    <div class="rule"></div>
    <p class="foot">abho7.github.io/fluid-sim</p>
  </div>
</body></html>
